name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-08ccc813355a600fb \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u exevolute bash /home/exevolute/hamaOffice/deploy.sh"]' \
            --timeout-seconds 900 \
            --query "Command.CommandId" --output text)
          echo "CommandId: $COMMAND_ID"

          # Docker のフルビルド(Next.js+Go)は数分かかるため、
          # aws ssm wait command-executed のデフォルトタイムアウト(数分)では
          # 短すぎて未完了のまま失敗扱いになる。自前でポーリングする。
          for i in $(seq 1 58); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-08ccc813355a600fb \
              --query "Status" --output text)
            echo "poll $i: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 15
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-08ccc813355a600fb \
            --query "StandardOutputContent" --output text

          echo "--- stderr ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-08ccc813355a600fb \
            --query "StandardErrorContent" --output text

          echo "Status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
