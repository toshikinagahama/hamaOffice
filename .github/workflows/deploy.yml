name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build frontend
        working-directory: frontend/hamaoffice
        run: |
          yarn install --frozen-lockfile
          npx next build
          npx next export

      - name: Copy frontend export into backend/out
        run: |
          rm -rf backend/out
          cp -r frontend/hamaoffice/out backend/out

      - name: Build backend binary
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/main .

      - name: Package artifact
        run: tar czf deploy-artifact.tar.gz backend/bin backend/out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Upload artifact to S3
        run: aws s3 cp deploy-artifact.tar.gz s3://hamaoffice-deploy-artifacts/deploy-artifact.tar.gz

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-08ccc813355a600fb \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/exevolute/hamaOffice && sudo -u exevolute git pull origin main","sudo -u exevolute bash /home/exevolute/hamaOffice/deploy.sh"]' \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)
          echo "CommandId: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-08ccc813355a600fb \
              --query "Status" --output text)
            echo "poll $i: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-08ccc813355a600fb \
            --query "StandardOutputContent" --output text

          echo "--- stderr ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-08ccc813355a600fb \
            --query "StandardErrorContent" --output text

          echo "Status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
